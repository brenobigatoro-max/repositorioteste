<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foguete e Lua</title>

    <style>
        /* Lua parada */
        #moon {
            position: fixed;
            top: 30px;
            right: 50px;
            font-size: 60px;
        }

        /* Foguete em movimento */
        #rocket {
            position: fixed;
            left: 50%;
            font-size: 50px;
            animation: lancamento 10s linear 1s infinite;
        }

        @keyframes lancamento {
            0% {
                top: 100vh;
            }

            100% {
                top: -10vh;
            }
        }
    </style>
</head>
<body>
    <p id="moon">🌙</p>
    <p id="rocket">🚀</p>
</body>
</html>
